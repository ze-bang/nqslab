[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nqslab"
version = "0.1.0"
description = "Neural quantum states for lattice spin models: lattices, operators, samplers, ansatze, natural-gradient optimisers, estimators and exact diagonalization in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "jax", "flax", "optax"]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
test = ["pytest", "pytest-timeout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1800
markers = ["slow: long end-to-end optimisations (deselect with -m 'not slow')"]

[tool.setuptools.packages.find]
include = ["nqslab*"]
